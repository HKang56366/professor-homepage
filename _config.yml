# GitHub Pages(Jekyll) 설정.
#
# 이 사이트의 HTML 은 _build/build.py 가 통째로 찍어 낸다. Jekyll 은 파일을
# 그대로 옮기기만 하면 된다(머리말이 없는 파일은 Jekyll 이 손대지 않는다).
#
# 여기서 하는 일은 하나다 — **쪽이 아닌 파일이 공개되어 검색에 잡히지 않게** 한다.
# 아래 것들은 저장소에는 남기되 게시하지 않는다.
#   README.md      저장소 설명. 방문자에게 보일 글이 아니다.
#   COMMENTS.md    댓글 기능 메모.
#   staticman.yml  댓글 백엔드 설정(현재 코드는 쓰지 않는다).
# `_` 로 시작하는 _build/ 와 _data/ 는 Jekyll 이 기본으로 뺀다.
exclude:
  - README.md
  - COMMENTS.md
  - staticman.yml
